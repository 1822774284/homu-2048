<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>渲染器调参 · 圆角盒</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a1020; overflow: hidden; color: #e2e8f0;
    font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif; }
  canvas { display: block; }
  #panel {
    position: fixed; top: 12px; right: 12px; width: 272px; max-height: calc(100vh - 24px);
    overflow-y: auto; padding: 10px 12px 12px; border-radius: 12px;
    background: rgba(17, 26, 46, .94); border: 1px solid rgba(148,163,184,.22);
    backdrop-filter: blur(8px);
  }
  #panel h2 { margin: 0 0 6px; font-size: 13px; letter-spacing: .06em; color: #7dd3fc; cursor: move; user-select: none; }
  #panel h3 { margin: 10px 0 4px; font-size: 11px; letter-spacing: .12em; color: #64748b; font-weight: 600; }
  .row { display: grid; grid-template-columns: 66px 1fr 46px; align-items: center; gap: 6px; margin: 3px 0; }
  .row label { color: #93a4bd; font-size: 12px; }
  .row output { color: #cbd5e1; font-variant-numeric: tabular-nums; text-align: right; font-size: 11px; }
  input[type=range] { width: 100%; height: 14px; }
  input[type=color] { width: 100%; height: 20px; border: 0; background: none; padding: 0; }
  input[type=text], select { width: 100%; padding: 2px 6px; border-radius: 6px; border: 1px solid rgba(148,163,184,.3);
    background: rgba(11,18,32,.8); color: #e2e8f0; font: inherit; }
  input[type=checkbox] { width: 16px; height: 16px; }
  #dump { margin: 10px 0 0; padding: 7px; border-radius: 8px; background: rgba(11,18,32,.9);
    color: #93a4bd; font: 10px/1.5 Consolas, monospace; white-space: pre-wrap; word-break: break-all; max-height: 92px; overflow: auto; }
  button { margin-top: 6px; width: 100%; padding: 6px; border-radius: 8px; cursor: pointer;
    border: 1px solid rgba(56,189,248,.45); background: rgba(56,189,248,.12); color: #7dd3fc; font: inherit; }
  .hint { position: fixed; left: 16px; bottom: 14px; color: #64748b; font-size: 12px; }
  #panel.collapsed .row, #panel.collapsed h3, #panel.collapsed #dump, #panel.collapsed #copy { display: none; }
</style>
</head>
<body>
<div class="hint">拖拽旋转 · 滚轮缩放 · 右侧调参（拖标题移动，双击收起）</div>

<div id="panel">
  <h2>圆角盒调参</h2>
  <div id="form"></div>
  <pre id="dump"></pre>
  <button id="copy">复制参数</button>
</div>

<script src="./vendor/three.min.js"></script>
<script src="./render3d.js"></script>
<script>
(() => {
  // ?cfg=<JSON> 可传入整组参数，便于复现某次调校
  let init = {}
  try {
    const raw = new URLSearchParams(location.search).get('cfg')
    if (raw) init = JSON.parse(raw)
  } catch { init = {} }
  const ctrl = HomuRender.smoke(document.body, init)

  const CONTROLS = [
    { k: 'radius', label: '圆角', sec: '形状', type: 'range', min: 0, max: 0.7, step: 0.01, fmt: 2 },
    { k: 'size', label: '尺寸', sec: '形状', type: 'range', min: 1, max: 2.6, step: 0.05, fmt: 2 },
    { k: 'segments', label: '细分', sec: '形状', type: 'range', min: 2, max: 20, step: 1, fmt: 0 },

    { k: 'roughness', label: '粗糙度', sec: '质感', type: 'range', min: 0, max: 1, step: 0.01, fmt: 2 },
    { k: 'metalness', label: '金属度', sec: '质感', type: 'range', min: 0, max: 1, step: 0.01, fmt: 2 },
    { k: 'clearcoat', label: '清漆', sec: '质感', type: 'range', min: 0, max: 1, step: 0.01, fmt: 2 },
    { k: 'clearcoatRough', label: '清漆粗糙', sec: '质感', type: 'range', min: 0, max: 1, step: 0.01, fmt: 2 },
    { k: 'emissive', label: '自发光', sec: '质感', type: 'range', min: 0, max: 1.5, step: 0.01, fmt: 2 },
    { k: 'sheen', label: '边缘高光', sec: '质感', type: 'range', min: 0, max: 1, step: 0.01, fmt: 2 },
    { k: 'sheenColor', label: '高光色', sec: '质感', type: 'color' },
    { k: 'sheenRough', label: '高光粗糙', sec: '质感', type: 'range', min: 0, max: 1, step: 0.01, fmt: 2 },
    { k: 'iridescence', label: '虹彩', sec: '质感', type: 'range', min: 0, max: 1, step: 0.01, fmt: 2 },
    { k: 'flat', label: '平面着色', sec: '质感', type: 'check' },

    { k: 'key', label: '主光', sec: '光照', type: 'range', min: 0, max: 6, step: 0.1, fmt: 1 },
    { k: 'hemi', label: '环境光', sec: '光照', type: 'range', min: 0, max: 3, step: 0.1, fmt: 1 },
    { k: 'rim', label: '边缘光', sec: '光照', type: 'range', min: 0, max: 3, step: 0.1, fmt: 1 },
    { k: 'keyColor', label: '主光色', sec: '光照', type: 'color' },
    { k: 'rimColor', label: '边缘光色', sec: '光照', type: 'color' },
    { k: 'keyAz', label: '主光方位', sec: '光照', type: 'range', min: 0, max: 360, step: 1, fmt: 0 },
    { k: 'keyEl', label: '主光高度', sec: '光照', type: 'range', min: -20, max: 89, step: 1, fmt: 0 },
    { k: 'shadows', label: '阴影', sec: '光照', type: 'check' },

    { k: 'exposure', label: '曝光', sec: '画面', type: 'range', min: 0.1, max: 2.5, step: 0.01, fmt: 2 },
    { k: 'tone', label: '色调映射', sec: '画面', type: 'select', options: [['aces', 'ACES'], ['reinhard', 'Reinhard'], ['linear', 'Linear'], ['none', '无']] },
    { k: 'fov', label: '视野', sec: '画面', type: 'range', min: 15, max: 75, step: 1, fmt: 0 },
    { k: 'dist', label: '相机距', sec: '画面', type: 'range', min: 3, max: 24, step: 0.2, fmt: 1 },
    { k: 'pageBg', label: '背景色', sec: '画面', type: 'color' },
    { k: 'ground', label: '地面', sec: '画面', type: 'check' },
    { k: 'groundColor', label: '地面色', sec: '画面', type: 'color' },
    { k: 'contact', label: '接触阴影', sec: '画面', type: 'range', min: 0, max: 1, step: 0.01, fmt: 2 },
    { k: 'env', label: '环境反射', sec: '画面', type: 'check' },
    { k: 'envIntensity', label: '反射强度', sec: '画面', type: 'range', min: 0, max: 3, step: 0.05, fmt: 2 },
    { k: 'envTop', label: '环境顶色', sec: '画面', type: 'color' },
    { k: 'envBottom', label: '环境底色', sec: '画面', type: 'color' },

    { k: 'bg', label: '方块色', sec: '颜色与文字', type: 'color' },
    { k: 'fg', label: '文字色', sec: '颜色与文字', type: 'color' },
    { k: 'label', label: '数字', sec: '颜色与文字', type: 'text' },
    { k: 'fontScale', label: '字号', sec: '颜色与文字', type: 'range', min: 0.4, max: 1.5, step: 0.02, fmt: 2 },
    { k: 'stroke', label: '描边', sec: '颜色与文字', type: 'range', min: 0, max: 10, step: 0.5, fmt: 1 },
    { k: 'grad', label: '渐变', sec: '颜色与文字', type: 'range', min: 0, max: 1, step: 0.01, fmt: 2 },
    { k: 'vgrad', label: '顶点渐变', sec: '颜色与文字', type: 'range', min: 0, max: 1, step: 0.01, fmt: 2 },
    { k: 'noise', label: '噪点', sec: '颜色与文字', type: 'range', min: 0, max: 1, step: 0.01, fmt: 2 },
  ]

  const form = document.getElementById('form')
  const nodes = new Map()
  let currentSection = null

  for (const c of CONTROLS) {
    if (c.sec !== currentSection) {
      currentSection = c.sec
      const h = document.createElement('h3')
      h.textContent = c.sec
      form.appendChild(h)
    }
    const row = document.createElement('div')
    row.className = 'row'
    const label = document.createElement('label')
    label.textContent = c.label
    const out = document.createElement('output')
    let input
    if (c.type === 'range') {
      input = document.createElement('input')
      input.type = 'range'
      input.min = c.min; input.max = c.max; input.step = c.step
    } else if (c.type === 'color') {
      input = document.createElement('input')
      input.type = 'color'
    } else if (c.type === 'check') {
      input = document.createElement('input')
      input.type = 'checkbox'
    } else if (c.type === 'select') {
      input = document.createElement('select')
      for (const [val, text] of c.options) {
        const opt = document.createElement('option')
        opt.value = val
        opt.textContent = text
        input.appendChild(opt)
      }
    } else {
      input = document.createElement('input')
      input.type = 'text'
      input.maxLength = 4
    }
    row.append(label, input, out)
    form.appendChild(row)
    nodes.set(c.k, { input, out, def: c })
  }

  function renderValues () {
    for (const [k, n] of nodes) {
      const c = n.def
      const v = ctrl.cfg[k]
      if (c.type === 'check') {
        n.input.checked = v === 1
        n.out.textContent = v === 1 ? '开' : '关'
      } else if (c.type === 'range') {
        n.input.value = v
        n.out.textContent = c.fmt === 0 ? String(v) : Number(v).toFixed(c.fmt)
      } else {
        n.input.value = v
        n.out.textContent = c.type === 'color' ? '' : ''
      }
    }
    document.getElementById('dump').textContent = JSON.stringify(ctrl.cfg)
  }

  for (const [k, n] of nodes) {
    const c = n.def
    const handler = () => {
      let v
      if (c.type === 'check') v = n.input.checked ? 1 : 0
      else if (c.type === 'range' || c.type === 'select') v = c.type === 'range' ? Number(n.input.value) : n.input.value
      else v = n.input.value
      ctrl.apply({ [k]: v })
      n.out.textContent = c.type === 'range' ? (c.fmt === 0 ? String(v) : Number(v).toFixed(c.fmt))
        : c.type === 'check' ? (v === 1 ? '开' : '关') : ''
      document.getElementById('dump').textContent = JSON.stringify(ctrl.cfg)
    }
    n.input.addEventListener('input', handler)
    if (c.type === 'select') n.input.addEventListener('change', handler)
  }

  document.getElementById('copy').addEventListener('click', async () => {
    const text = JSON.stringify(ctrl.cfg)
    try {
      await navigator.clipboard.writeText(text)
      document.getElementById('copy').textContent = '已复制'
    } catch {
      const pre = document.getElementById('dump')
      const range = document.createRange()
      range.selectNodeContents(pre)
      const sel = getSelection()
      sel.removeAllRanges()
      sel.addRange(range)
      document.getElementById('copy').textContent = '已选中，按 Ctrl+C'
    }
    setTimeout(() => { document.getElementById('copy').textContent = '复制参数' }, 1600)
  })

  // 滚轮缩放时，把相机距同步回面板与 JSON，避免导出的是旧值
  ctrl.onZoom = (r) => {
    const n = nodes.get('dist')
    if (!n) return
    n.input.value = r
    n.out.textContent = Number(r).toFixed(1)
    document.getElementById('dump').textContent = JSON.stringify(ctrl.cfg)
  }

  renderValues()
})()
</script>
<script src="./panel-drag.js"></script>
</body>
</html>
