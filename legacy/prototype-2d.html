<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>吼姆 2048 · 立体版（原型）</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #111a2e;
    --cell: #1b2742;
    --fg: #e2e8f0;
    --dim: #94a3b8;
    --gold: #fbbf24;
    --tilt: 52deg;
    --lift: 14px;
    --cell: 104px;
    --gap: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: radial-gradient(1200px 600px at 50% 0%, #16264a 0%, transparent 60%), var(--bg);
    color: var(--fg);
    font: 15px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none;
    overflow: hidden;
  }
  .wrap { width: min(100%, 520px); }
  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 6px; }
  h1 { margin: 0; font-size: 24px; letter-spacing: 0.05em; }
  h1 em { color: var(--gold); font-style: normal; }
  .sub { margin: 0; color: var(--dim); font-size: 12px; }
  .scores { display: flex; gap: 8px; }
  .score { padding: 5px 10px; border: 1px solid rgba(148,163,184,.18); border-radius: 10px; background: var(--panel); text-align: right; }
  .score span { display: block; color: var(--dim); font-size: 10px; letter-spacing: .1em; }
  .score b { font-size: 16px; font-variant-numeric: tabular-nums; }

  /* ---- 场景与相机 ---- */
  .scene {
    perspective: 1100px;
    perspective-origin: 50% 26%;
    padding: 40px 0 96px;
    display: grid;
    place-items: center;
  }
  .board {
    width: calc(var(--cell) * 4 + var(--gap) * 3 + 16px);
    padding: 8px;
    border-radius: 16px;
    background: linear-gradient(160deg, #16233c, #0e1729);
    box-shadow: 0 40px 60px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(148,163,184,.12);
    transform: rotateX(var(--tilt));
    transform-style: preserve-3d;
    transition: transform .25s ease;
  }
  body[data-flat] .board { transform: none; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, var(--cell));
    gap: var(--gap);
    transform-style: preserve-3d;
  }
  .slot {
    position: relative;
    width: var(--cell);
    height: var(--cell);
    transform-style: preserve-3d;
  }
  /* 底板上的凹槽 */
  .slot::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: var(--cell);
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, .45);
  }
  /* 方块正面（抬起来的那一面） */
  .face {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 30px;
    font-variant-numeric: tabular-nums;
    transform: translateZ(var(--lift));
    transform-style: preserve-3d;
    transition: transform .12s ease, background .12s ease, opacity .12s ease;
    opacity: 0;
  }
  /* 方块的侧面：把正面与底板连起来 */
  .face::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    height: var(--lift);
    background: var(--side, rgba(0,0,0,.35));
    transform-origin: top center;
    transform: rotateX(-90deg);
    border-radius: 0 0 9px 9px;
    filter: brightness(0.72);
  }
  .face[data-v="0"] { opacity: 0; }
  .face[data-v="2"] { opacity: 1; background: #cbd5e1; color: #0b1220; --side: #cbd5e1; }
  .face[data-v="4"] { opacity: 1; background: #94a3b8; color: #0b1220; --side: #94a3b8; }
  .face[data-v="8"] { opacity: 1; background: #7dd3fc; color: #0b1220; --side: #7dd3fc; }
  .face[data-v="16"] { opacity: 1; background: #38bdf8; color: #0b1220; --side: #38bdf8; }
  .face[data-v="32"] { opacity: 1; background: #0ea5e9; color: #f8fafc; --side: #0ea5e9; }
  .face[data-v="64"] { opacity: 1; background: #2563eb; color: #f8fafc; --side: #2563eb; }
  .face[data-v="128"] { opacity: 1; background: #6d28d9; color: #f8fafc; --side: #6d28d9; font-size: 26px; }
  .face[data-v="256"] { opacity: 1; background: #7c3aed; color: #f8fafc; --side: #7c3aed; font-size: 24px; }
  .face[data-v="512"] { opacity: 1; background: #a21caf; color: #f8fafc; --side: #a21caf; font-size: 22px; }
  .face[data-v="1024"] { opacity: 1; background: #db2777; color: #f8fafc; --side: #db2777; font-size: 19px; }
  .face[data-v="2048"] { opacity: 1; background: linear-gradient(145deg, #f59e0b, #fbbf24); color: #1f2937; --side: #d97706; font-size: 17px; }
  .face[data-v="4096"] { opacity: 1; background: #b91c1c; color: #fef2f2; --side: #991b1b; font-size: 17px; }

  .face.pop { animation: pop .18s ease; }
  @keyframes pop {
    0% { transform: translateZ(var(--lift)) scale(.82); }
    60% { transform: translateZ(calc(var(--lift) + 6px)) scale(1.05); }
    100% { transform: translateZ(var(--lift)) scale(1); }
  }

  footer { margin-top: 4px; color: var(--dim); font-size: 12px; text-align: center; }
  .hint { color: #64748b; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><em>吼姆</em> 2048</h1>
      <p class="sub">立体版原型 · 方向键 / WASD，R 重开，Z 撤销</p>
    </div>
    <div class="scores">
      <div class="score"><span>SCORE</span><b id="score">0</b></div>
      <div class="score"><span>BEST</span><b id="best">0</b></div>
    </div>
  </header>

  <div class="scene">
    <div class="board">
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <footer>俯仰 52°，方块抬起 14px。<span class="hint">加 ?flat=1 可切平面模式。</span></footer>
</div>

<script>
(() => {
  const SIZE = 4
  const VALUE_LABEL = { 2048: '吼姆' }
  const gridEl = document.getElementById('grid')
  const scoreEl = document.getElementById('score')
  const bestEl = document.getElementById('best')

  /* ---------- 规则层：和平面版完全一致 ---------- */
  function slide(line) {
    const nums = line.filter((v) => v)
    const out = []
    let gained = 0
    for (let i = 0; i < nums.length; i += 1) {
      if (nums[i] === nums[i + 1]) {
        const merged = nums[i] * 2
        out.push(merged)
        gained += merged
        i += 1
      } else {
        out.push(nums[i])
      }
    }
    while (out.length < SIZE) out.push(0)
    return { line: out, gained }
  }

  function lineOf(board, dir, index) {
    if (dir === 'left') return board[index].slice()
    if (dir === 'right') return board[index].slice().reverse()
    if (dir === 'up') return board.map((row) => row[index])
    return board.map((row) => row[index]).reverse()
  }

  function writeLine(board, dir, index, line) {
    const values = dir === 'right' ? line.slice().reverse() : line
    if (dir === 'left' || dir === 'right') {
      board[index] = values
      return
    }
    for (let r = 0; r < SIZE; r += 1) {
      const row = dir === 'up' ? r : SIZE - 1 - r
      board[row][index] = values[r]
    }
  }

  function move(input, dir) {
    const board = input.map((row) => row.slice())
    let gained = 0
    let moved = false
    for (let i = 0; i < SIZE; i += 1) {
      const { line, gained: g } = slide(lineOf(board, dir, i))
      gained += g
      writeLine(board, dir, i, line)
    }
    for (let r = 0; r < SIZE; r += 1) {
      for (let c = 0; c < SIZE; c += 1) if (board[r][c] !== input[r][c]) moved = true
    }
    return { board, gained, moved }
  }

  function canMove(board) {
    for (let r = 0; r < SIZE; r += 1) for (let c = 0; c < SIZE; c += 1) if (!board[r][c]) return true
    for (const dir of ['left', 'right', 'up', 'down']) if (move(board, dir).moved) return true
    return false
  }

  function blank() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(0))
  }

  /* ---------- 场景层：只负责把状态画成方块 ---------- */

  const faces = []
  for (let i = 0; i < SIZE * SIZE; i += 1) {
    const slot = document.createElement('div')
    slot.className = 'slot'
    const face = document.createElement('div')
    face.className = 'face'
    face.dataset.v = '0'
    slot.appendChild(face)
    gridEl.appendChild(slot)
    faces.push(face)
  }

  let board = blank()
  let score = 0
  let best = Number(localStorage.getItem('homu3d:best') || 0)
  let history = null
  let won = false

  function spawn(random = Math.random) {
    const empty = []
    for (let r = 0; r < SIZE; r += 1) for (let c = 0; c < SIZE; c += 1) if (!board[r][c]) empty.push([r, c])
    if (!empty.length) return null
    const [r, c] = empty[Math.floor(random() * empty.length)]
    board[r][c] = random() < 0.9 ? 2 : 4
    return r * SIZE + c
  }

  function paint(changed = new Set()) {
    for (let i = 0; i < faces.length; i += 1) {
      const value = board[Math.floor(i / SIZE)][i % SIZE]
      const face = faces[i]
      face.dataset.v = String(value)
      face.textContent = value ? (VALUE_LABEL[value] || value) : ''
      face.classList.remove('pop')
      if (changed.has(i) && value) {
        void face.offsetWidth
        face.classList.add('pop')
      }
    }
    scoreEl.textContent = String(score)
    bestEl.textContent = String(best)
  }

  function start() {
    board = blank()
    score = 0
    history = null
    won = false
    spawn()
    spawn()
    paint()
    localStorage.setItem('homu3d:board', JSON.stringify(board))
    localStorage.setItem('homu3d:score', String(score))
  }

  function step(dir) {
    const result = move(board, dir)
    if (!result.moved) return
    history = { board: board.map((row) => row.slice()), score }
    board = result.board
    score += result.gained
    const born = spawn()
    const changed = new Set()
    for (let i = 0; i < SIZE * SIZE; i += 1) if (board[Math.floor(i / SIZE)][i % SIZE]) changed.add(i)
    if (born !== null) changed.add(born)
    if (score > best) {
      best = score
      localStorage.setItem('homu3d:best', String(best))
    }
    paint(changed)
    if (!won && board.some((row) => row.some((v) => v >= 2048))) won = true
    if (!canMove(board)) paint()
  }

  function undo() {
    if (!history) return
    board = history.board
    score = history.score
    history = null
    paint()
  }

  const KEYS = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down', A: 'left', D: 'right', W: 'up', S: 'down',
  }

  window.addEventListener('keydown', (event) => {
    if (event.key === 'r' || event.key === 'R') { start(); return }
    if (event.key === 'z' || event.key === 'Z' || event.key === 'Backspace') { event.preventDefault(); undo(); return }
    const dir = KEYS[event.key]
    if (!dir) return
    event.preventDefault()
    step(dir)
  })

  if (new URLSearchParams(location.search).has('flat')) document.body.dataset.flat = ''

  start()
})()
</script>
</body>
</html>
